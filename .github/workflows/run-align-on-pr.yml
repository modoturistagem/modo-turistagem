name: Executar alinhamento do portal

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Aplicar alterações sobre os arquivos atuais
        shell: bash
        run: |
          awk 'BEGIN{capture=0} /          python - <<'\''PY'\''/{capture=1} capture{sub(/^          /,""); print} capture && /^          PY$/{exit}' .github/workflows/align-portal-copy.yml > /tmp/apply-portal.sh
          bash /tmp/apply-portal.sh
          rm -f .github/workflows/run-align-on-pr.yml

      - name: Salvar alterações na branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Alinha site ao Portal de Roteiros"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
