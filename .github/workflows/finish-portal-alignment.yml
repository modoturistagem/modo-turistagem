name: Finalizar alinhamento do portal

on:
  push:
    branches:
      - agent/alinha-site-portal-roteiros

permissions:
  contents: write

jobs:
  finish:
    if: github.event.head_commit.message != 'Finaliza alinhamento do site com o portal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alinha-site-portal-roteiros
          fetch-depth: 0

      - name: Executar e registrar resultado
        shell: bash
        run: |
          set +e
          python .github/finish_portal.py > /tmp/portal-alignment.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/portal-alignment.log .github/portal-alignment-error.txt
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ "$status" -eq 0 ]; then
            git commit -m "Finaliza alinhamento do site com o portal"
          else
            git commit -m "Registra erro no alinhamento do portal"
          fi
          git push origin HEAD:agent/alinha-site-portal-roteiros
