name: Aplicar validade de seis meses

on:
  push:
    branches:
      - agent/alinha-site-portal-roteiros

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Define validade de seis meses para os acessos'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/alinha-site-portal-roteiros
          fetch-depth: 0

      - name: Atualizar regra de validade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = load(path)
              if old not in text:
                  raise RuntimeError(f'Trecho não encontrado em {path}: {old[:120]}')
              save(path, text.replace(old, new, 1))

          # Página pública de roteiros
          path = 'roteiros-prontos.html'
          text = load(path)
          old = '<p>Depois da confirmação do pagamento, a Modo cria seu acesso individual. Você recebe usuário e senha e encontra somente os roteiros liberados para a sua conta.</p>'
          new = '<p>Depois da confirmação do pagamento, a Modo cria seu acesso individual. Você recebe usuário e senha e encontra somente os roteiros liberados para a sua conta. O acesso fica disponível por <strong>6 meses a partir da liberação</strong>.</p>'
          if old not in text:
              raise RuntimeError('Texto do cartão do portal não encontrado')
          text = text.replace(old, new, 1)
          text = text.replace('Acesso ao Portal enviado após a confirmação do pagamento', 'Acesso ao Portal por 6 meses, liberado após a confirmação do pagamento')
          save(path, text)

          # FAQ
          path = 'faq.html'
          text = load(path)
          old = '<p>Você entra no <strong>Portal de Roteiros</strong>, consulta o conteúdo pelo celular e também pode salvar uma versão em PDF quando quiser.</p>'
          new = '<p>Você entra no <strong>Portal de Roteiros</strong>, consulta o conteúdo pelo celular e também pode salvar uma versão em PDF quando quiser. O acesso permanece ativo por <strong>6 meses a partir da liberação</strong>.</p>'
          if old not in text:
              raise RuntimeError('Resposta de recebimento no FAQ não encontrada')
          text = text.replace(old, new, 1)

          access_question = '''
    <div class="faq-item fade-in">
      <button class="faq-pergunta" type="button" aria-expanded="false">
        <span class="faq-pergunta-texto">Por quanto tempo tenho acesso ao roteiro?</span>
        <span class="faq-icon" aria-hidden="true">+</span>
      </button>
      <div class="faq-resposta">
        <div class="faq-resposta-inner">
          <div class="faq-resposta-conteudo">
            <p>O acesso ao Portal de Roteiros é válido por <strong>6 meses contados a partir da liberação</strong>. Durante esse período, você pode consultar o roteiro online, acompanhar as atualizações publicadas pela Modo e salvar uma versão em PDF.</p>
          </div>
        </div>
      </div>
    </div>

'''
          if 'Por quanto tempo tenho acesso ao roteiro?' not in text:
              marker = '    <div class="faq-item fade-in">\n      <button class="faq-pergunta" type="button" aria-expanded="false">\n        <span class="faq-pergunta-texto">Perdi meu usuário ou minha senha. O que faço?</span>'
              if marker not in text:
                  raise RuntimeError('Ponto de inserção da validade no FAQ não encontrado')
              text = text.replace(marker, access_question + marker, 1)
          save(path, text)

          # Painel administrativo
          path = 'portal/admin.html'
          text = load(path)
          text = text.replace(
              '<p class="compact-help">Só você cria o acesso. O cliente recebe as credenciais prontas e não consegue se cadastrar sozinho.</p>',
              '<p class="compact-help">Só você cria o acesso. O cliente recebe as credenciais prontas, válidas por 6 meses a partir da liberação, e não consegue se cadastrar sozinho.</p>',
              1,
          )
          old = '<label>Validade opcional<input id="clientExpiry" type="date" /></label>'
          new = '<label>Validade do acesso<input id="clientExpiry" type="date" readonly aria-describedby="clientExpiryHelp" /></label><p id="clientExpiryHelp" class="compact-help">Calculada automaticamente: 6 meses a partir da criação do acesso.</p>'
          if old not in text:
              raise RuntimeError('Campo antigo de validade não encontrado')
          text = text.replace(old, new, 1)
          old = '<p><b>Senha:</b> <span id="resultPassword"></span></p>'
          new = '<p><b>Senha:</b> <span id="resultPassword"></span></p>\n            <p><b>Válido até:</b> <span id="resultExpiry"></span></p>'
          if old not in text:
              raise RuntimeError('Resultado de credenciais não encontrado')
          text = text.replace(old, new, 1)
          save(path, text)

          # JavaScript do admin: calcula, envia e mostra sempre seis meses
          path = 'portal/js/admin.js'
          text = load(path)
          marker = '''  const formatDate = value => {
    if (!value) return 'Sem atualização registrada';
    try {
      return `Atualizado em ${new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(new Date(value))}`;
    } catch {
      return 'Atualização registrada';
    }
  };
'''
          addition = marker + '''
  const sixMonthsFrom = (source = new Date()) => {
    const result = new Date(source);
    const originalDay = result.getDate();
    result.setDate(1);
    result.setMonth(result.getMonth() + 6);
    const lastDay = new Date(result.getFullYear(), result.getMonth() + 1, 0).getDate();
    result.setDate(Math.min(originalDay, lastDay));
    result.setHours(23, 59, 59, 999);
    return result;
  };

  const toDateInputValue = date => {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  };

  const syncClientExpiry = () => {
    const expiry = sixMonthsFrom();
    document.querySelector('#clientExpiry').value = toDateInputValue(expiry);
    return expiry;
  };
'''
          if 'const sixMonthsFrom =' not in text:
              if marker not in text:
                  raise RuntimeError('Ponto para helper de validade não encontrado')
              text = text.replace(marker, addition, 1)

          old = "    const expiry = document.querySelector('#clientExpiry').value || null;"
          new = "    const expiry = syncClientExpiry();"
          if old not in text:
              raise RuntimeError('Leitura antiga da validade não encontrada')
          text = text.replace(old, new, 1)
          text = text.replace(
              '        access_expires_at: expiry ? new Date(`${expiry}T23:59:59`).toISOString() : null',
              '        access_expires_at: expiry.toISOString()',
              1,
          )
          old = "    document.querySelector('#resultPassword').textContent = password;\n    credentialResult.classList.remove('is-hidden');\n    say(clientMessage, `Acesso criado e roteiro “${data.itinerary_title}” liberado.`, 'success');"
          new = "    document.querySelector('#resultPassword').textContent = password;\n    const confirmedExpiry = new Date(data.access_expires_at || expiry);\n    document.querySelector('#resultExpiry').textContent = new Intl.DateTimeFormat('pt-BR', { dateStyle: 'long' }).format(confirmedExpiry);\n    credentialResult.dataset.expiry = confirmedExpiry.toISOString();\n    credentialResult.classList.remove('is-hidden');\n    say(clientMessage, `Acesso criado, válido por 6 meses, e roteiro “${data.itinerary_title}” liberado.`, 'success');"
          if old not in text:
              raise RuntimeError('Bloco de resultado da criação não encontrado')
          text = text.replace(old, new, 1)
          old = "    const text = `Seu acesso ao Portal Modo Turistagem\nUsuário: ${username}\nSenha: ${password}\nAcesse: ${config.siteUrl || location.origin}`;"
          new = "    const expiry = document.querySelector('#resultExpiry').textContent;\n    const text = `Seu acesso ao Portal Modo Turistagem\nUsuário: ${username}\nSenha: ${password}\nVálido até: ${expiry}\nAcesse: ${config.siteUrl || location.origin}`;"
          if old not in text:
              raise RuntimeError('Texto para copiar credenciais não encontrado')
          text = text.replace(old, new, 1)
          old = "  fill(window.MODO_PREVIEW_ITINERARY);\n  verify();"
          new = "  fill(window.MODO_PREVIEW_ITINERARY);\n  syncClientExpiry();\n  verify();"
          if old not in text:
              raise RuntimeError('Inicialização do admin não encontrada')
          text = text.replace(old, new, 1)
          save(path, text)

          # Edge Function: regra obrigatória também no servidor
          path = 'supabase/functions/create-client/index.ts'
          text = load(path)
          insert_after = '''const normalizeUsername = (value: string) => value
  .trim()
  .toLowerCase()
  .normalize('NFD')
  .replace(/[\\u0300-\\u036f]/g, '')
  .replace(/[^a-z0-9._-]/g, '')
  .replace(/^[._-]+|[._-]+$/g, '')
'''
          helper = insert_after + '''
const sixMonthsFrom = (source = new Date()) => {
  const result = new Date(source)
  const originalDay = result.getUTCDate()
  result.setUTCDate(1)
  result.setUTCMonth(result.getUTCMonth() + 6)
  const lastDay = new Date(Date.UTC(result.getUTCFullYear(), result.getUTCMonth() + 1, 0)).getUTCDate()
  result.setUTCDate(Math.min(originalDay, lastDay))
  result.setUTCHours(23, 59, 59, 999)
  return result
}
'''
          if 'const sixMonthsFrom =' not in text:
              if insert_after not in text:
                  raise RuntimeError('Ponto para helper da Edge Function não encontrado')
              text = text.replace(insert_after, helper, 1)
          old = "    const accessExpiresAt = payload.access_expires_at ? String(payload.access_expires_at) : null"
          new = "    const accessExpiresAt = sixMonthsFrom().toISOString()"
          if old not in text:
              raise RuntimeError('Validade antiga da Edge Function não encontrada')
          text = text.replace(old, new, 1)
          old = "      itinerary_title: itinerary.title,\n    })"
          new = "      itinerary_title: itinerary.title,\n      access_expires_at: accessExpiresAt,\n    })"
          if old not in text:
              raise RuntimeError('Retorno da Edge Function não encontrado')
          text = text.replace(old, new, 1)
          save(path, text)

          # Schema: novos acessos e acessos antigos sem vencimento
          path = 'portal/supabase/schema.sql'
          text = load(path)
          old = 'access_expires_at timestamptz,created_at timestamptz not null default now()'
          new = "access_expires_at timestamptz not null default (now()+interval '6 months'),created_at timestamptz not null default now()"
          if old not in text:
              raise RuntimeError('Coluna access_expires_at não encontrada no schema')
          text = text.replace(old, new, 1)
          migration = "\nupdate public.itinerary_access set access_expires_at=created_at+interval '6 months' where access_expires_at is null;\nalter table public.itinerary_access alter column access_expires_at set default (now()+interval '6 months');\nalter table public.itinerary_access alter column access_expires_at set not null;\n"
          if 'alter column access_expires_at set not null' not in text:
              table_line_end = text.find('\n', text.find('create table if not exists public.itinerary_access'))
              text = text[:table_line_end+1] + migration + text[table_line_end+1:]
          text = text.replace('expires_at_value timestamptz default null', "expires_at_value timestamptz default (now()+interval '6 months')", 1)
          text = text.replace('values(target_user,target_itinerary,expires_at_value)', "values(target_user,target_itinerary,coalesce(expires_at_value,now()+interval '6 months'))", 1)
          save(path, text)

          # README do portal
          path = 'portal/README.md'
          text = load(path)
          anchor = '- O acesso aos roteiros é controlado no Supabase com RLS.'
          if anchor in text and '6 meses' not in text:
              text = text.replace(anchor, anchor + '\n- Cada acesso de cliente é válido por 6 meses a partir da liberação.', 1)
              save(path, text)

          # Validação final
          checks = {
              'roteiros-prontos.html': ['6 meses a partir da liberação', 'Acesso ao Portal por 6 meses'],
              'faq.html': ['Por quanto tempo tenho acesso ao roteiro?', '6 meses contados a partir da liberação'],
              'portal/admin.html': ['resultExpiry', 'Calculada automaticamente: 6 meses'],
              'portal/js/admin.js': ['sixMonthsFrom', 'Válido até: ${expiry}'],
              'supabase/functions/create-client/index.ts': ['access_expires_at: accessExpiresAt', 'sixMonthsFrom().toISOString()'],
              'portal/supabase/schema.sql': ["interval '6 months'", 'alter column access_expires_at set not null'],
          }
          for path, needles in checks.items():
              text = load(path)
              for needle in needles:
                  if needle not in text:
                      raise RuntimeError(f'Validação falhou em {path}: {needle}')

          Path('.github/workflows/apply-six-month-access.yml').unlink(missing_ok=True)
          PY

      - name: Salvar alterações
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Define validade de seis meses para os acessos"
          git push origin HEAD:agent/alinha-site-portal-roteiros
